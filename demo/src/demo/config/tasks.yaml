business_analytics_task:
  description: >
    Analyze the topic "{topic}" and convert it into a frontend product brief.
    The user story identifier is "{us}".
    If human_feedback is provided, revise the output to address it before finalizing.
    Define the target users, product objective, core user journeys, key screens,
    important UI elements, functional requirements, and acceptance criteria.
    Keep the output implementation-ready for a React frontend developer.
    The markdown output must be written entirely in Vietnamese.
  expected_output: >
    A markdown document with sections for overview, goals, audience, user flows,
    screen breakdown, functional requirements, and acceptance criteria.
    Formatted as markdown without '```'. The entire output must be in Vietnamese.
  agent: business_analytics

frontend_developer_task:
  description: >
    Use the business analysis context from {business_analysis} and the design blueprint
    from {design_blueprint} to generate a complete ReactJS application for "{topic}".
    Review the existing application context from
    {existing_app_context} before generating new code so you can preserve or improve the current app.
    If human_feedback is provided, revise the output to address it before finalizing.
    Return the full application as plain text source files for a small React app that will be
    materialized inside the folder `outputs/app`. Include all essential files needed to understand
    and run the app, such as `package.json`, `src/main.jsx`, `src/App.jsx`, and any minimal
    supporting files you consider necessary. The response must strictly use this manifest format
    so each file can be written directly into `outputs/app`: `FILE: package.json` followed by
    that file's contents, then `FILE: src/main.jsx` followed by that file's contents, and so on
    for every file. Each file section must begin with a line starting exactly with `FILE: `.
    Do not include explanations, markdown fences, or any text before the first `FILE: ` line
    or after the last file content.
  expected_output: >
    Raw ReactJS app source code only in strict multi-file manifest format, for example:
    `FILE: package.json`, `FILE: src/main.jsx`, `FILE: src/App.jsx`.
    No markdown, no commentary, and no surrounding code fences.
  agent: frontend_developer
  output_file: outputs/app/APP_SOURCE.txt

researcher_task:
  description: >
    Review the business analysis from {business_analysis} for "{topic}" and the user story
    identifier "{us}". If a reference URL is available in {reference_url}, use it as a source
    to extract relevant market, content, UX, or information architecture insights; otherwise,
    analyze the topic itself to infer useful design inputs.
    Produce a concise research brief that gives the designer concrete parameters such as target
    expectations, suggested content groups, interaction patterns, tone, constraints, and any
    assumptions. If human_feedback is provided, revise the output to address it before finalizing.
    The markdown output must be written entirely in Vietnamese.
  expected_output: >
    A markdown research brief with sections for insight summary, reference findings,
    recommended design parameters, content suggestions, interaction ideas, and assumptions.
    Formatted as markdown without '```'. The entire output must be in Vietnamese.
  agent: researcher

designer_task:
  description: >
    Use the business analysis from {business_analysis} and the research brief from
    {research_brief} to create a design blueprint for "{topic}".
    The output should act like a wireframe specification for the frontend developer:
    describe the screen structure, section order, layout blocks, components, visual hierarchy,
    content placement, states, and key interactions. Keep the design practical and aligned
    with the business requirements. If human_feedback is provided, revise the output to address
    it before finalizing. The markdown output must be written entirely in Vietnamese.
  expected_output: >
    A markdown design blueprint with sections for design direction, layout structure,
    screen-by-screen wireframe notes, component guidance, interaction states, and UI constraints.
    Formatted as markdown without '```'. The entire output must be in Vietnamese.
  agent: designer

manual_tester_task:
  description: >
    Review the business analysis from {business_analysis} for "{topic}" and the user story
    identifier "{us}", then produce a manual QA plan in parallel with frontend implementation.
    Create test scenarios, expected outcomes, edge cases, usability concerns, exploratory checks,
    and release risks based on the requirements.
    If human_feedback is provided, revise the output to address it before finalizing.
    The markdown output must be written entirely in Vietnamese.
  expected_output: >
    A markdown QA report containing test scenarios, expected results, risk assessment,
    and a concise defect list if any issues are identified.
    Formatted as markdown without '```'. The entire output must be in Vietnamese.
  agent: manual_tester
